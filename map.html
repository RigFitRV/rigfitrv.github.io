<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campground Map & Routing Directory - RigFitRV</title>
  <meta name="description" content="Interactive map of verified RV campgrounds across New Jersey and Pennsylvania with clearance and routing intelligence.">
  <link rel="stylesheet" href="style.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <!-- Custom Favicons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

  <style>
    /* Map Container */
    #map {
      height: 550px;
      width: 100%;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      margin: 1.5rem 0;
      z-index: 1;
    }

    /* Leaflet Popup Layout Customizations */
    .leaflet-popup-content-wrapper {
      padding: 0.5rem;
      border-radius: 8px;
    }
    .leaflet-popup-content {
      margin: 8px 12px;
      width: 310px !important; /* Set comfortable popup width */
    }
    .map-popup-card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .map-popup-thumb {
      width: 90px;
      height: 90px;
      object-fit: cover;
      border-radius: 6px;
      flex-shrink: 0;
      border: 1px solid #cbd5e1;
    }
    .map-popup-info {
      flex: 1;
    }
    .map-popup-info h3 {
      margin: 0 0 4px 0;
      font-size: 1rem;
      color: #0f172a;
      line-height: 1.25;
    }
    .map-popup-info p {
      font-size: 0.825rem;
      color: #475569;
      margin: 0 0 8px 0;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .map-popup-info .btn {
      display: inline-block;
      padding: 0.3rem 0.6rem;
      font-size: 0.8rem;
    }
  </style>

  <!-- Prevent AI Model Training & Image Scraping -->
<meta name="robots" content="noai, noimageai">
<meta name="tdm-reservation" content="1">
</head>
<body>

  <!-- Universal Header -->
  <div id="header-placeholder"></div>
  <script>
    fetch('header.html')
      .then(response => response.text())
      .then(data => document.getElementById('header-placeholder').innerHTML = data);
  </script>

  <div class="container">
    <div class="article-card">
      <h1>🗺️ RigFitRV Interactive Campground Directory</h1>
      <p>Explore verified RV logistics, clearance warnings, and loop fit data across the Mid-Atlantic. Click any map pin to view guide details.</p>

      <!-- Interactive Map -->
      <div id="map"></div>
    </div>
  </div>

  <!-- Universal Footer -->
  <div id="footer-placeholder"></div>
  <script>
    fetch('footer.html')
      .then(response => response.text())
      .then(data => document.getElementById('footer-placeholder').innerHTML = data);
  </script>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Initialize map centered roughly over PA/NJ
      const map = L.map('map').setView([40.25, -74.90], 8);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      // Fetch dynamic campground data
      fetch('data/campgrounds.json')
        .then(response => response.json())
        .then(campgrounds => {
          const bounds = [];

          campgrounds.forEach(c => {
            if (c.lat && c.lng) {
              const marker = L.marker([c.lat, c.lng]).addTo(map);

              // Construct popup with thumbnail fallback
              const imgPath = c.image || 'favicon-96x96.png';
              const popupContent = `
                <div class="map-popup-card">
                  <img src="${imgPath}" alt="${c.name}" class="map-popup-thumb" onerror="this.src='favicon-96x96.png'; this.style.objectFit='contain';">
                  <div class="map-popup-info">
                    <h3>${c.name} (${c.state})</h3>
                    <p>${c.summary}</p>
                    <a href="c/${c.id}.html" class="btn">View Full Guide →</a>
                  </div>
                </div>
              `;

              marker.bindPopup(popupContent);
              bounds.push([c.lat, c.lng]);
            }
          });

          if (bounds.length > 0) {
            map.fitBounds(bounds, { padding: [50, 50], maxZoom: 10 });
          }
        })
        .catch(err => console.error('Error loading map markers:', err));
    });
  </script>

</body>
</html>
