<body>

  <nav>
    <a href="index.html">← Back to RigFitRV Home</a>
  </nav>

  <h1>Submit RVer Intelligence & New Campgrounds</h1>
  <p>Help fellow RVers travel with confidence! Submit a ground-truth update for an existing guide or request a new campground to be added to RigFitRV.</p>

  <form action="https://formspree.io/f/mjygepzn" method="POST">
    
    <div class="form-group">
      <label for="submission-type">Submission Type</label>
      <select id="submission-type" name="submission-type" required>
        <option value="Update Existing Guide">Update Existing Campground Guide</option>
        <option value="Request New Location">Request / Submit New Campground</option>
      </select>
    </div>

    <div class="form-group">
      <label for="campground-name">Campground Name & State</label>
      <input type="text" id="campground-name" name="campground-name" placeholder="e.g. French Creek State Park, PA" required>
    </div>

    <div class="form-group">
      <label for="rig-details">Your Rig Setup (Optional)</label>
      <input type="text" id="rig-details" name="rig-details" placeholder="e.g. 30ft Class C with Jeep Toad">
    </div>

    <div class="form-group">
      <label for="details">Logistical Notes & Intelligence</label>
      <textarea id="details" name="details" placeholder="Share specific details on tree clearance, low branches, unhooking areas, steep hills, or best sites for big rigs..." required></textarea>
    </div>

    <div class="form-group">
      <label for="email">Your Email (Optional, if you'd like credit or follow-up questions)</label>
      <input type="email" id="email" name="email" placeholder="you@example.com">
    </div>

    <button type="submit" class="btn">Send Submission →</button>

  </form>

  <footer>
    <p>&copy; 2026 RigFitRV. Real-world campground data built for RVers, by RVers.</p>
  </footer>

</body>
